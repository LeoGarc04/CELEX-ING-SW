# Copiar como application-local.properties. Nunca subir el archivo con credenciales.
spring.datasource.url=jdbc:mysql://localhost:3306/celex
spring.datasource.username=CAMBIAR_USUARIO_MYSQL
spring.datasource.password=CAMBIAR_CLAVE_MYSQL
spring.sql.init.mode=never
