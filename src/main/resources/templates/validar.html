<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${!signedIn ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><section class="auth"><h1>Validación de comprobante CELEX</h1><p th:if="${#lists.isEmpty(receipts)}" class="notice error">No existe un comprobante con este código.</p><article th:each="r:${receipts}"><h2 th:text="${r.estado_inscripcion=='Confirmada'?'Comprobante vigente':'Comprobante sin vigencia'}"></h2><p th:text="${r.folio}"></p><p th:text="${r.idioma}+' · '+${r.nivel}"></p><p th:text="${r.fecha_emision}"></p></article></section></main></div><footer>CELEX · ESIME Culhuacán</footer></body></html>
