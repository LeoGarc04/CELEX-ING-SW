<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${(!signedIn or queueFocused) ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><div class="heading"><div><h1>Mapa curricular</h1><p>Niveles de los idiomas configurados por CELEX.</p><form method="get" th:action="@{/mapa-curricular}"><label>Idioma<select name="idioma"><option th:each="language:${languages}" th:value="${language.id_idioma}" th:text="${language.nombre}" th:selected="${language.id_idioma==curriculum.idIdioma}"></option></select></label><button>Ver mapa</button></form></div><span class="tag" th:text="${curriculum.acreditados}+' de '+${curriculum.total}+' niveles acreditados'"></span></div><section class="card"><h2>Tu nivel</h2><p th:if="${!#strings.isEmpty(curriculum.nivelActual)}" th:text="'Nivel registrado: '+${curriculum.nivelActual}"></p><p th:text="${curriculum.decision}"></p><p class="muted">La inscripción depende del nivel asignado por CELEX. El mapa no cambia tu nivel ni acredita cursos automáticamente.</p></section><div class="curriculum-stages"><section class="card curriculum-stage" th:each="stage:${curriculum.etapas}"><h2 th:text="${stage.nombre}"></h2><ol class="level-list"><li th:each="level:${stage.niveles}" th:classappend="${(level.asignado?' current':'')+(level.acreditado?' passed':'')}" th:attr="data-level=${level.nombre}"><b th:text="${level.nombre}"></b><span class="tag" th:if="${level.asignado}">Nivel asignado</span><span class="tag" th:if="${level.acreditado}">Acreditado</span><small th:if="${level.calificacion != null}" th:text="'Calificación: '+${level.calificacion}"></small><small class="muted" th:if="${!level.asignado and !level.acreditado and level.calificacion == null}">Sin registro</small></li></ol></section></div></main></div><footer th:replace="~{layout :: footer}"></footer></body></html>
