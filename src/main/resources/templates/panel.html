<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${!signedIn ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><p class="eyebrow">MI INSCRIPCIÓN</p><h1 th:text="'Hola, '+${account.nombre_completo}"></h1><p><span class="badge" th:text="${account.tipo_usuario}"></span> <span th:text="${account.estado_cuenta}"></span></p><section><h2>Convocatorias</h2><p>Consulta las fechas antes de ingresar. La oferta depende del nivel asignado por CELEX.</p><div class="cards"><article th:each="c:${calls}"><h3 th:text="${c.nombre}"></h3><p th:text="${#temporals.format(c.fecha_inicio_fila,'dd/MM/yyyy HH:mm')}+' — '+${#temporals.format(c.fecha_fin_fila,'dd/MM/yyyy HH:mm')}"></p><span class="badge" th:text="${c.estado_visible}"></span><form method="post" th:action="@{/fila}"><input type="hidden" name="convocatoria" th:value="${c.id_convocatoria}"><button th:disabled="${c.estado_visible!='Abierta'}">Ingresar a la fila</button></form></article></div><p th:if="${#lists.isEmpty(calls)}">Todavía no hay convocatorias.</p></section><section><h2>Mis turnos</h2><p th:each="t:${turns}"><a th:href="@{/fila/{f}(f=${t.folio})}" th:text="${t.folio}"></a> · <span th:text="${t.estado_turno}"></span></p></section><section><h2>Mis solicitudes</h2><div class="cards"><article th:each="s:${requests}"><h3 th:text="${s.idioma}+' · '+${s.nivel}"></h3><p th:text="${s.folio}"></p><span class="badge" th:text="${s.estado_inscripcion}"></span><p><a th:href="@{/solicitud/{id}(id=${s.id_solicitud})}">Ver solicitud y documentos →</a></p></article></div></section></main></div><footer>CELEX · ESIME Culhuacán</footer></body></html>
