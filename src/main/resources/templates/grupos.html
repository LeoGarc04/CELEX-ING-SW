<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${(!signedIn or queueFocused) ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><h1>Elige tu grupo</h1><p>Solo se muestran grupos compatibles con el nivel e historial asignados por CELEX.</p><div id="queue" th:attr="data-folio=${turn.folio}"><p data-network role="status"></p></div><div class="toolbar"><label>Idioma<select data-offer-filter="idioma"><option value="">Todos los idiomas</option></select></label><label>Nivel<select data-offer-filter="nivel"><option value="">Todos los niveles</option></select></label><label>Modalidad<select data-offer-filter="modalidad"><option value="">Todas las modalidades</option></select></label></div><label>Buscar en la oferta<input id="filter" placeholder="Ej. Inglés Básico Sabatino"></label><p data-offer-update role="status" class="muted"></p><div class="cards" data-offer-list><article class="filter-item" th:each="g:${groups}" th:attr="data-group=${g.id_grupo},data-idioma=${g.idioma},data-nivel=${g.nivel},data-modalidad=${g.modalidad}"><h2 th:text="${g.idioma}+' · '+${g.nivel}"></h2><p th:text="${g.modalidad}"></p><p th:text="${g.profesor}+' · Aula '+${g.aula}"></p><p th:text="${T(mx.ipn.esime.celex.service.Rules).dayNames(g.dias)}+' · '+${g.horario}"></p><span class="badge" data-capacity th:text="${g.cupo_disponible>0 ? 'Disponible: '+g.cupo_disponible : 'Agotado'}"></span><form method="post" th:action="@{/fila/{f}/grupo(f=${turn.folio})}"><input type="hidden" name="grupo" th:value="${g.id_grupo}"><button th:disabled="${g.cupo_disponible<1}">Confirmar grupo</button></form></article></div><p th:if="${#lists.isEmpty(groups)}" class="notice">No hay grupos compatibles. Contacta a CELEX para revisar tu nivel o examen de colocación.</p></main></div><footer>CELEX · ESIME Culhuacán</footer></body></html>
