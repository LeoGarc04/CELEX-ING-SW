<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><h1>Mis grupos</h1><p>Consulta tus alumnos y registra sus calificaciones.</p><section class="card" th:each="g:${groups}"><h2 th:text="${g.idioma}+' · '+${g.nivel}"></h2><p th:text="${g.convocatoria}+' · Grupo '+${g.id_grupo}+' · '+${g.dias}+' · '+${g.horario}"></p><a class="button" th:href="@{/profesor/grupos/{id}(id=${g.id_grupo})}">Consultar alumnos y calificaciones</a></section><p th:if="${#lists.isEmpty(groups)}">Todavía no tienes grupos asignados. Solicita la asignación al administrador.</p></main></div><footer>CELEX · ESIME Culhuacán</footer></body></html>
