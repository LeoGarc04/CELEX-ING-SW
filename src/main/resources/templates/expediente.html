<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><h1>Expediente académico</h1><section class="card"><h2 th:text="${student.nombre_completo}"></h2><p th:text="${student.correo}"></p><p th:text="${student.boleta != null ? 'Boleta: '+student.boleta : 'CURP: '+student.curp}+' · Teléfono: '+${student.telefono}"></p><p th:text="${student.tipo_usuario}+' · '+${student.estado_cuenta}"></p></section><section class="card"><h2>Historial</h2><article th:each="h:${histories}"><h3 th:text="${h.idioma}+' · '+${h.nivel_actual}"></h3><p th:text="'Calificación: '+${h.calificacion}+' · '+${h.decision}"></p><p th:text="${h.fecha_registro}"></p></article><p th:if="${#lists.isEmpty(histories)}">Sin historial registrado.</p></section><section class="card"><h2>Prioridad registrada</h2><article th:each="p:${priorities}"><p th:text="'Becario: '+${p.es_becario}+' · Puntaje: '+${p.puntaje_beca}+' · Promedio: '+${p.promedio_anterior}+' · Nuevo: '+${p.es_alumno_nuevo}"></p></article></section><a href="/admin#historial">Volver al historial</a></main></div></body></html>
