<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${(!signedIn or queueFocused) ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><section class="auth"><h1>Define una nueva contraseña</h1><p class="notice" th:if="${message}" th:text="${message}"></p><form method="post" th:action="@{/restablecer}"><label>Correo<input name="correo" type="email" required th:value="${correo}"></label><label>Código de recuperación<input name="codigo" type="text" required maxlength="10"></label><label>Nueva contraseña<input name="password" type="password" required minlength="12" maxlength="64"></label><button type="submit">Guardar contraseña</button></form></section></main></div><footer>CELEX · ESIME Culhuacán</footer></body></html>
