<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${(!signedIn or queueFocused) ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><section class="auth"><h1>Define una nueva contraseña</h1><p class="notice" th:if="${message}" th:text="${message}"></p><form method="post" th:action="@{/restablecer}"><label>Correo<input name="correo" type="email" required th:value="${correo}"></label><label>Código de recuperación<input name="codigo" type="text" required minlength="6" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code"></label><label>Nueva contraseña<input name="password" type="password" required minlength="8" data-password-policy maxlength="64"></label><p class="muted">Mínimo 8 caracteres, una mayúscula y un número.</p><button type="submit">Guardar contraseña</button></form></section></main></div><footer th:replace="~{layout :: footer}"></footer></body></html>
