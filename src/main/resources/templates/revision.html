<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${!signedIn ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><h1>Revisión de solicitud</h1><p th:text="${request.nombre_completo}+' · '+${request.folio}"></p><p th:text="${request.estado_inscripcion}"></p><p th:text="'Cuota: $'+${request.monto_calculado}"></p><section th:each="d:${documents}"><h2 th:text="${d.estatus_pago}"></h2><p th:text="'Referencia: '+${d.numero_referencia}+' · Importe: $'+${d.importe}+' · '+${d.fecha_pago}"></p><a th:href="@{/documentos/{id}/pago(id=${d.id_documento})}" target="_blank" rel="noopener">Abrir comprobante</a> · <a th:href="@{/documentos/{id}/identificacion(id=${d.id_documento})}" target="_blank" rel="noopener">Abrir identificación</a><p th:text="'Pago: '+${d.estado_pago}+' · '+${d.observacion_pago}"></p><p th:text="'Identificación: '+${d.estado_identificacion}+' · '+${d.observacion_identificacion}"></p></section><section th:if="${request.estado_inscripcion=='Pendiente de revisión'}"><form method="post" th:action="@{/admin/solicitudes/{id}/dictamen(id=${request.id_solicitud})}"><p>Ambos documentos deben aprobarse para confirmar la inscripción. Un documento rechazado abre un plazo de corrección de dos días hábiles.</p><label>Dictamen del pago<select name="pago" required><option value="">Selecciona</option><option>Aprobado</option><option>Rechazado</option></select></label><label>Observaciones del pago<textarea name="observacionPago" maxlength="4000"></textarea></label><label>Dictamen de identificación<select name="identificacion" required><option value="">Selecciona</option><option>Aprobado</option><option>Rechazado</option></select></label><label>Observaciones de identificación<textarea name="observacionIdentificacion" maxlength="4000"></textarea></label><button type="submit">Guardar dictamen y notificar</button></form></section></main></div><footer>CELEX · ESIME Culhuacán</footer></body></html>
