<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: header}"></header><div class="shell" th:classappend="${(!signedIn or queueFocused) ? 'user-layout' : ''}"><aside th:replace="~{layout :: sidebar}"></aside><main class="main"><h1>Revisión de trámites</h1><article class="card" th:each="p:${procedures}"><h2 th:text="${p.tipo}+' · '+${p.nombre}"></h2><span class="tag" th:text="${p.estado}"></span><p th:text="'$'+${p.monto}+' MXN · Referencia '+${p.referencia}+' · '+${p.fechaPago}"></p><a th:if="${!#strings.isEmpty(p.archivo)}" th:href="@{/tramites/{id}/comprobante(id=${p.id})}" target="_blank" rel="noopener">Ver comprobante</a><form th:if="${p.estado=='Pendiente de revisión'}" method="post" th:action="@{/admin/tramites/{id}(id=${p.id})}"><label>Dictamen<select name="estado"><option>Aprobado</option><option>Rechazado</option></select></label><label>Observaciones<textarea name="observaciones" maxlength="4000"></textarea></label><button>Guardar y notificar</button></form><p th:text="${p.observaciones}"></p></article><p th:if="${#lists.isEmpty(procedures)}">No hay trámites registrados.</p></main></div><footer th:replace="~{layout :: footer}"></footer></body></html>
