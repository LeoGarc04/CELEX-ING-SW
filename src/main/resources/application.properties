spring.application.name=celex
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/celex}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
server.port=${PORT:8080}
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
celex.mail-from=${MAIL_FROM:}
celex.institutional-domains=${IPN_DOMAINS:alumno.ipn.mx}
celex.fee-ipn=${FEE_IPN:620.00}
celex.fee-public=${FEE_PUBLIC:1280.00}
celex.storage=${CELEX_STORAGE:./storage}
celex.public-url=${PUBLIC_URL:http://localhost:8080}
celex.zone=${CELEX_ZONE:America/Mexico_City}
spring.task.scheduling.pool.size=2
celex.backup.enabled=${BACKUP_ENABLED:true}
celex.backup.directory=${BACKUP_DIRECTORY:./backups}
celex.backup.login-path=${BACKUP_LOGIN_PATH:celex-backup}
celex.backup.database=${BACKUP_DATABASE:celex}

server.forward-headers-strategy=framework
celex.holidays=${CELEX_HOLIDAYS:}
celex.mail-daily-limit=${MAIL_DAILY_LIMIT:400}
